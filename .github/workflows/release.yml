name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Linux release
    runs-on: ubuntu-latest
    env:
      LIBRARY_PATH: /usr/local/lib
      LD_LIBRARY_PATH: /usr/local/lib
      PKG_CONFIG_PATH: /usr/local/lib/pkgconfig
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ zlib1g-dev libxkbcommon-dev libwayland-dev libx11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-x11-dev libgl1-mesa-dev libegl1-mesa-dev

      - name: Build TagLib 2
        run: |
          git clone --depth 1 --branch v2.0.2 --recurse-submodules --shallow-submodules https://github.com/taglib/taglib.git /tmp/taglib
          cmake -S /tmp/taglib -B /tmp/taglib-build -DBUILD_SHARED_LIBS=ON -DBUILD_TESTING=OFF -DBUILD_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build /tmp/taglib-build -j2
          sudo cmake --install /tmp/taglib-build
          sudo ldconfig

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust helper
        working-directory: rust
        run: cargo build --release

      - name: Compile Python sources
        env:
          PYTHONPYCACHEPREFIX: /tmp/pycache
        run: python3 -m compileall -q puddlestuff puddlemore_main.py

      - name: Package release
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          name="PuddleMore-${tag}-x86_64-linux"
          mkdir -p "dist/${name}/rust/target/release" release
          cp PuddleMore PuddleMore.desktop PuddleMore.png README.md \
             PuddleMore_PROJECT_SUMMARY.md LICENSE copyright THANKS \
             requirements.txt puddlemore_main.py "dist/${name}/"
          cp -r puddlestuff screenshots "dist/${name}/"
          cp -r rust/src rust/assets "dist/${name}/rust/"
          cp rust/Cargo.toml rust/Cargo.lock rust/README.md "dist/${name}/rust/"
          cp rust/target/release/puddlemore "dist/${name}/rust/target/release/"
          chmod +x "dist/${name}/PuddleMore" "dist/${name}/rust/target/release/puddlemore"
          find "dist/${name}" -type d -name __pycache__ -prune -exec rm -rf {} +
          find "dist/${name}" -type f -name '*.py[co]' -delete
          tar -C dist -czf "release/${name}.tar.gz" "${name}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: 'release/*.tar.gz'
          generate_release_notes: true
